name: docker image CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: ${{ github.repository }}

  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: test_cve_db
  DB_USER: test_cve_user
  DB_PASSWORD: 123456

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.DB_NAME }}
          POSTGRES_USER: ${{ env.DB_USER }}
          POSTGRES_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment file
        run: |
          cat > .env << EOF
          DB_HOST=${{ env.DB_HOST }}
          DB_PORT=${{ env.DB_PORT }}
          DB_NAME=${{ env.DB_NAME }}
          DB_USER=${{ env.DB_USER }}
          DB_PASSWORD=${{ env.DB_PASSWORD }}
          NVD_API_URL=https://services.nvd.nist.gov/rest/json/cves/2.0
          CYCLE_DAYS=120
          RESULTS_PER_PAGE=2000
          EOF

      - name: Run pytest
        run: |
          pytest -v
   
  sast:
    name: SAST Scan with Horusec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Horusec Security Scan
        id: horusec-scan
        uses: fike/horusec-action@v0.2.2
        with:
          arguments: >
            -p ./
            --output-format "json"
            --json-output-file horusec-result.json
            --ignore "**/tests/**"