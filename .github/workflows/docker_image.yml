name: Test Docker for PR

on:
  pull_request:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'
  TEST_DB_HOST: localhost
  TEST_DB_PORT: 5432
  TEST_DB_NAME: test_cve_db
  TEST_DB_USER: test_cve_user
  TEST_DB_PASSWORD: 123456

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
          POSTGRES_USER: ${{ env.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment file
        run: |
          cat > .env << EOF
          DB_HOST=${{ env.TEST_DB_HOST }}
          DB_PORT=${{ env.TEST_DB_PORT }}
          DB_NAME=${{ env.TEST_DB_NAME }}
          DB_USER=${{ env.TEST_DB_USER }}
          DB_PASSWORD=${{ env.TEST_DB_PASSWORD }}
          NVD_API_URL=https://services.nvd.nist.gov/rest/json/cves/2.0
          EOF
      
      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U test_cve_user; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run pytest
        run: |
          pytest -v
   
  sast:
    name: SAST Scan with Horusec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Horusec Security Scan
        id: horusec-scan
        uses: fike/horusec-action@v0.2.2
        with:
          arguments: >
            -p ./
            --output-format "json"
            --json-output-file horusec-result.json
            --return-error="false"
            --ignore "**/tests/**, **/docker-compose.yml"
        
      - name: Upload Horusec Result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-security-result
          path: horusec-result.json

      - name: Check Horusec Severity Threshold
        run: |
          CRITICAL=$(jq '[
            (.analysisVulnerabilities // .vulnerabilities // []) | .[] 
            | select(.severity == "CRITICAL")] | length' horusec-result.json)

          echo " Critical: $CRITICAL"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "Critical vulnerabilities found! Review horusec-result.json"
            exit 1
          fi

  build:
    name: Run docker image
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: success() 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build for PR
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cve-importer:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: smoke test docker image
        if: github.event_name == 'pull_request'
        run: | 
          docker run --rm \
          -e SMOKE_TEST=true \
          cve-importer:pr-${{ github.event.pull_request.number }}
      
      - name: Send notification to slack
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            text: "GitHub Action build result: ${{ job.status }}\n${{ github.event.pull_request.html_url}}"