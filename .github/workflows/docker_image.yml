name: docker image Dry run

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  PYTHON_VERSION: '3.11'
  IMAGE_NAME: ${{ github.repository }}

  TEST_DB_HOST: localhost
  TEST_DB_PORT: 5432
  TEST_DB_NAME: test_cve_db
  TEST_DB_USER: test_cve_user
  TEST_DB_PASSWORD: 123456

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.TEST_DB_NAME }}
          POSTGRES_USER: ${{ env.TEST_DB_USER }}
          POSTGRES_PASSWORD: ${{ env.TEST_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment file
        run: |
          cat > .env << EOF
          DB_HOST=${{ env.TEST_DB_HOST }}
          DB_PORT=${{ env.TEST_DB_PORT }}
          DB_NAME=${{ env.TEST_DB_NAME }}
          DB_USER=${{ env.TEST_DB_USER }}
          DB_PASSWORD=${{ env.TEST_DB_PASSWORD }}
          NVD_API_URL=https://services.nvd.nist.gov/rest/json/cves/2.0
          CYCLE_DAYS=120
          RESULTS_PER_PAGE=2000
          EOF

      - name: Run pytest
        run: |
          pytest -v
   
  sast:
    name: SAST Scan with Horusec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Horusec Security Scan
        id: horusec-scan
        uses: fike/horusec-action@v0.2.2
        with:
          arguments: >
            -p ./
            --output-format "json"
            --json-output-file horusec-result.json
            --return-error="false"
            --ignore "**/tests/**, **/docker-compose.yml"
        
      - name: Upload Horusec Result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horusec-security-result
          path: horusec-result.json

      - name: Check Horusec Severity Threshold
        run: |
          CRITICAL=$(jq '[
            (.analysisVulnerabilities // .vulnerabilities // []) | .[] 
            | select(.severity == "CRITICAL")] | length' horusec-result.json)

          echo " Critical: $CRITICAL"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "Critical vulnerabilities found! Review horusec-result.json"
            exit 1
          fi

      
  build:
    name: Dry run docker image
    runs-on: ubuntu-latest
    needs: [test, sast]
    if: success()
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dry build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: cve-importer:test-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: smoke test docker image 
        run: | 
          docker run --rm \
          -e DB_HOST=${{ env.TEST_DB_HOST }}\
          -e DB_NAME=${{ env.TEST_DB_NAME }} \
          -e DB_USER=${{ env.TEST_DB_USER }} \
          -e DB_PASSWORD=${{ env.TEST_DB_PASSWORD }} \
          -e START_DATE=2024-01-01 \
          cve-importer:test-${{ github.sha }} \
          uvicorn src.api.api:app --host 0.0.0.0 --port 8000